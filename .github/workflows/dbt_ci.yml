name: dbt CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dbt-build:
    name: dbt build & test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/436355772361/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: dbt-runner@ecommerce-analytics-497016.iam.gserviceaccount.com

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          ecommerce:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: ecommerce-analytics-497016
                dataset: dbt_dev
                threads: 4
                timeout_seconds: 300
                location: US
          EOF

      - name: dbt build
        working-directory: dbt/ecommerce
        run: dbt build